<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Code to Everything: a map of programs beyond software</title>
  <desc id="desc">Tasks become programs that run in interpreters, renderers, simulators and proof assistants. Eight illustrated applications show visual reasoning, media, CAD, computer use, robotics, world models, mathematics and science, with representative papers. Feedback may revise programs, guide search or train a model.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d7dfdf"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#567575" stroke-width="1.6"/></marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .ink { fill: #172f3b; }
      .muted { fill: #526775; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2.4px; }
      .card-title { font-size: 24px; font-weight: 700; fill: #172f3b; }
      .body { font-size: 19px; fill: #334d5c; }
      .paper { font-size: 17px; fill: #526775; }
      .mono { font-family: Consolas, 'Courier New', monospace; }
      .line { fill: none; stroke: #267c80; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .card { fill: #ffffff; stroke: #d9e3e2; stroke-width: 1.4; }
    </style>
  </defs>
  <rect width="1600" height="1040" rx="22" fill="#f5f7f3"/>
  <rect x="1" y="1" width="1598" height="1038" rx="21" fill="none" stroke="#d9e3e2"/>
  <rect x="1050" y="16" width="520" height="162" fill="url(#grid)"/>
  <rect x="48" y="46" width="8" height="104" rx="4" fill="#198a83"/>
  <text x="77" y="62" class="eyebrow" fill="#267c80">CODING AGENTS BEYOND SOFTWARE</text>
  <text x="73" y="124" font-size="59" font-weight="750" class="ink">Code to Everything</text>
  <text x="77" y="161" font-size="24" class="muted">How coding agents are expanding beyond software</text>
  <text x="1287" y="72" class="mono" font-size="49" font-weight="700" fill="#267c80">{ }</text>
  <text x="1170" y="111" font-size="20" class="ink">Executable representations</text>
  <text x="1170" y="143" font-size="18" class="muted">Programs · execution · feedback</text>
  <line x1="48" x2="1552" y1="192" y2="192" stroke="#cdd9d7"/>
  <text x="48" y="231" class="eyebrow" fill="#526775">TASK · PROGRAM · EXECUTION</text>
  <rect x="48" y="251" width="284" height="154" rx="14" fill="#e8efec"/>
  <text x="68" y="285" class="eyebrow" fill="#267c80">01 / TASK</text>
  <text x="68" y="320" font-size="23" font-weight="650" class="ink">A goal + context</text>
  <text x="68" y="351" class="body">Question · image · instruction</text>
  <text x="68" y="378" class="body">Data · state · formal statement</text>
  <path d="M 344 328 H 378" stroke="#567575" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="392" y="251" width="471" height="154" rx="14" fill="#153744"/>
  <circle cx="413" cy="273" r="4" fill="#73c6b4"/><circle cx="429" cy="273" r="4" fill="#e7b86d"/><circle cx="445" cy="273" r="4" fill="#779ab0"/>
  <text x="839" y="279" text-anchor="end" class="mono" font-size="16" fill="#aec7cd">02 / PROGRAM</text>
  <text x="414" y="316" class="mono" font-size="20" fill="#91dbc2">answer = compose(tools, inputs)</text>
  <text x="414" y="346" class="mono" font-size="20" fill="#e8c88c">artifact = render(parameters)</text>
  <text x="414" y="376" class="mono" font-size="20" fill="#b8b9f0">state = transition(state, action)</text>
  <path d="M 876 328 H 910" stroke="#567575" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="924" y="251" width="300" height="154" rx="14" fill="#e8efec"/>
  <text x="944" y="285" class="eyebrow" fill="#267c80">03 / EXECUTOR</text>
  <text x="944" y="320" font-size="23" font-weight="650" class="ink">Domain capabilities</text>
  <text x="944" y="351" class="body">Interpreter · renderer · APIs</text>
  <text x="944" y="378" class="body">Simulator · solver · prover</text>
  <path d="M 1236 328 H 1270" stroke="#567575" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="1284" y="251" width="268" height="154" rx="14" fill="#e8efec"/>
  <text x="1304" y="285" class="eyebrow" fill="#267c80">04 / RESULT</text>
  <text x="1304" y="320" font-size="22" font-weight="650" class="ink">Observable outcome</text>
  <text x="1304" y="351" class="body">Answer · artifact · behavior</text>
  <text x="1304" y="378" class="body">Prediction · proof · candidate</text>
  <path d="M 1418 405 V 428 Q 1418 440 1406 440 H 650 Q 634 440 634 425 V 413" fill="none" stroke="#90aaa5" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <rect x="791" y="425" width="516" height="29" fill="#f5f7f3"/>
  <text x="802" y="446" font-size="18" fill="#526775">Feedback can drive revision, search or training.</text>
  <text x="48" y="493" class="eyebrow" fill="#526775">EIGHT APPLICATIONS / DIFFERENT RESPONSIBILITIES FOR CODE</text>
